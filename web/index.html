<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>内涝地图</title>
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <h1 data-s="title"></h1>
    <label><span data-s="city"></span>
      <select id="city"></select>
    </label>
    <label><span data-s="drainage"></span>
      <input id="drainage" type="range" min="0.2" max="2" step="0.1" value="1" />
    </label>
    <p class="hint" data-s="drainageHint"></p>
    <div id="legend"></div>
    <p class="hint" data-s="legendDisclaimer"></p>
    <p class="hint coverage-note"><i></i><span data-s="coverageNote"></span></p>
    <label class="check"><input id="showElevation" type="checkbox" /><span data-s="showElevation"></span></label>
    <div id="elevPanel" hidden>
      <div id="elevLegend"></div>
      <label class="detail"><span data-s="contourDetail"></span>
        <input id="contourDetail" type="range" min="1" max="4" step="1" value="1" />
      </label>
    </div>
    <p id="freshness"></p>
    <p id="coverage" class="hint" hidden></p>
    <div class="panel-actions">
      <button id="about" data-s="aboutBtn"></button>
      <button id="tourOpen" data-s="tourBtn"></button>
      <button id="lang"></button>
    </div>
  </div>
  <div id="timebar">
    <input id="time" type="range" disabled />
    <div id="timelabel"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
